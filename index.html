<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AI Expert 결과물 갤러리</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f5f6f8; --surface:#fff; --ink:#14181f; --muted:#5d6675; --line:#e3e6eb;
  --accent:#1a4fd6; --accent-soft:#e8eefc; --chip:#eef0f3; --shadow:0 1px 2px rgba(20,24,31,.06),0 8px 24px rgba(20,24,31,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --surface:#181c24; --ink:#eef1f6; --muted:#9aa3b2; --line:#2a303b;
  --accent:#7aa2ff; --accent-soft:#1d2a4a; --chip:#232833; --shadow:0 1px 2px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
header{padding:56px 0 28px}
.eyebrow{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.02em}
h1{font-size:clamp(28px,4vw,40px);line-height:1.2;margin:8px 0 10px;letter-spacing:-.02em}
.lead{color:var(--muted);margin:0;font-size:16px}
.stats{display:flex;gap:20px;margin-top:20px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.stats b{color:var(--ink);font-size:18px;margin-right:4px}
.toolbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:24px}
.toolbar .wrap{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 240px;min-width:0;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--chip);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px;padding-bottom:64px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:left;font:inherit;color:inherit;padding:0}
.card:hover,.card:focus-visible{transform:translateY(-2px);box-shadow:var(--shadow);outline:none}
.thumb{aspect-ratio:4/3;background:#fff;border-bottom:1px solid var(--line);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.tag{background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:6px;font-weight:600}
.tag.dept{background:var(--chip);color:var(--muted);font-weight:500}
.card h2{font-size:17px;margin:0;line-height:1.35;letter-spacing:-.01em}
.card p{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.who{margin-top:auto;padding-top:6px;font-size:14px;font-weight:600}
.empty{color:var(--muted);padding:40px 0;text-align:center;grid-column:1/-1}
dialog{border:0;padding:0;width:min(1100px,100vw);max-width:100vw;height:min(92vh,900px);max-height:100vh;border-radius:16px;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,12,16,.6)}
.dlg{display:flex;flex-direction:column;height:100%}
.dlg-head{padding:18px 20px 0;display:flex;gap:12px;align-items:flex-start}
.dlg-head h3{margin:0;font-size:20px;line-height:1.3}
.dlg-head .sub{color:var(--muted);font-size:14px;margin-top:4px}
.close{margin-left:auto;border:0;background:var(--chip);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;flex:none}
.tabs{display:flex;gap:4px;padding:14px 20px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;color:var(--muted);font:inherit;font-size:15px;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--ink);font-weight:600}
.tab-spacer{flex:1}
.open-link{align-self:center;font-size:13px;color:var(--accent);text-decoration:none;white-space:nowrap;padding:0 4px}
.frame{flex:1;background:var(--bg)}
.frame iframe{width:100%;height:100%;border:0;display:block}
footer{color:var(--muted);font-size:13px;padding:0 0 40px}
@media (max-width:640px){
  header{padding:36px 0 20px}
  .wrap{padding:0 16px}
  dialog{height:100vh;border-radius:0}
}
</style>
</head>
<body>
<header class="wrap">

, "summary": "당일 리스트와 QnA 원문을 근거로 현장 문의에 답하고, 근거가 없으면 담당자에게 넘기는 응대 에이전트", "ids": {"video": "15OcEOT1kXe21f2CDv3zsOaY26UKt4pgM", "pamphlet": "1BYiNeb4H22-AhKo_qUWCf0l1o7qWQoyw", "slides": "1cYTiYhV8ToxZ4Cjpow4ji_1paWgZr08a"}}, {"n": 21, "name": "김수민", "dept": "마케팅P", "team": "3조", "title": "지점장 싱글뷰", "summary": "전사 일보를 FC 한 명 단위로 뒤집어, 오늘 누구를 왜 어떻게 만날지 지점장에게 건네는 에이전트", "ids": {"pamphlet": "11hUGV600GaNvEdDhISCRdaPiPhPeaHVq", "video": "1LcaLISTJZGvMx1mj_VkN6pkOSkP3Uhl6", "slides": "14eElacB0FbwQMYsQtSblgcLGvE0GEPVt"}}, {"n": 22, "name": "김지훈", "dept": "상품인프라P", "team": "2조", "title": "상품개발 보조 에이전트", "summary": "상품 문서를 대조해 상품 시스템에 넣을 데이터와 계산 함수 입력 초안을 자동으로 만드는 에이전트", "ids": {"pamphlet": "1Ar057dPQ8PZ9z7xqY6K8etJSYdAXr0M7", "video": "1N10EZkzRFttNBg1jT8QT2ym754yEkrYy", "slides": "1keomEvUuCjPGI9uw97BFbArNbX55cvas"}}];
const KINDS = [["pamphlet","팜플렛"],["slides","발표자료"],["video","시연영상"]];
const $ = s => document.querySelector(s);
const grid = $("#grid"), chips = $("#chips"), q = $("#q"), dlg = $("#dlg");
let team = "전체";

$("#cnt").textContent = DATA.length;
$("#ppl").textContent = DATA.reduce((a,d)=>a+d.name.split(",").length,0);

const teams = ["전체", ...[...new Set(DATA.map(d=>d.team).filter(Boolean))].sort()];
teams.forEach(t=>{
  const b = document.createElement("button");
  b.className="chip"; b.textContent=t; b.setAttribute("aria-pressed", t===team);
  b.onclick=()=>{team=t; chips.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", c===b)); render();};
  chips.appendChild(b);
});

const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  const term = q.value.trim().toLowerCase();
  const list = DATA.filter(d =>
    (team==="전체" || d.team===team) &&
    (!term || [d.name,d.dept,d.title,d.summary].join(" ").toLowerCase().includes(term)));
  grid.innerHTML = list.length ? list.map(d=>`
    <button class="card" data-n="${d.n}">
      <div class="thumb"><img src="thumbs/${d.n}.jpg" alt="${esc(d.title)} 팜플렛 첫 페이지" loading="lazy"></div>
      <div class="body">
        <div class="meta">${d.team?`<span class="tag">${d.team}</span>`:""}<span class="tag dept">${esc(d.dept)}</span></div>
        <h2>${esc(d.title)}</h2>
        <p>${esc(d.summary)}</p>
        <div class="who">${esc(d.name)}</div>
      </div>
    </button>`).join("") : `<div class="empty">조건에 맞는 결과물이 없어요.</div>`;
}
grid.addEventListener("click", e=>{
  const c = e.target.closest(".card"); if(c) open(DATA.find(d=>d.n==c.dataset.n));
});
q.addEventListener("input", render);

function open(d){
  $("#dlgTitle").textContent = d.title;
  $("#dlgSub").textContent = `${d.name} · ${d.dept}${d.team?" · "+d.team:""}`;
  const tabs = $("#tabs"); tabs.innerHTML="";
  const link = document.createElement("a");
  link.className="open-link"; link.target="_blank"; link.rel="noopener"; link.textContent="새 창에서 열기 ↗";
  KINDS.forEach(([k,label],i)=>{
    const t = document.createElement("button");
    t.className="tab"; t.role="tab"; t.textContent=label;
    t.onclick=()=>{
      tabs.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected", x===t));
      $("#frame").innerHTML = `<iframe src="https://drive.google.com/file/d/${d.ids[k]}/preview" allow="autoplay; fullscreen" allowfullscreen title="${label}"></iframe>`;
      link.href = `https://drive.google.com/file/d/${d.ids[k]}/view`;
    };
    tabs.appendChild(t);
    if(i===0) queueMicrotask(()=>t.click());
  });
  const sp = document.createElement("span"); sp.className="tab-spacer"; tabs.append(sp, link);
  dlg.showModal();
}
$("#close").onclick = ()=>dlg.close();
dlg.addEventListener("click", e=>{ if(e.target===dlg) dlg.close(); });
dlg.addEventListener("close", ()=>{ $("#frame").innerHTML=""; });
render();
</script>
</body>
</html>
